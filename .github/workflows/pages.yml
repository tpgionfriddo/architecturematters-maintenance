name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Old WordPress URLs (e.g. /contact-us/) 404 on Pages. Serve the same page
      # there, with root-absolute asset paths so it renders at any depth.
      - name: Build 404.html
        run: |
          sed -e 's#"img/#"/img/#g' -e 's#"favicon.png"#"/favicon.png"#' -e 's#href="\./"#href="/"#' \
            public/index.html > public/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
